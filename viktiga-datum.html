<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#152248;--gold:#c8a96e;--ink:#0b1529;--pale:#dde6f4;--frost:#f0f4fb;--white:#fff;--silver:#8fa0bb}
body{font-family:'DM Sans',sans-serif;background:var(--frost);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased;min-height:100vh}
nav{background:var(--white);border-bottom:1px solid var(--pale);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:72px;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 rgba(21,34,72,.06)}
.nav-left a{display:flex;flex-direction:column;text-decoration:none}
.nav-left img{height:50px;width:auto}
.nav-left span{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-top:2px}
.nav-right{display:flex;gap:10px;align-items:center}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--navy);text-decoration:none;font-size:13px;font-weight:600;padding:8px 16px;border:1.5px solid var(--pale);border-radius:999px;transition:all .2s}
.back-btn:hover{background:var(--navy);color:white;border-color:var(--navy)}
.back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.filter-btn{display:flex;align-items:center;gap:6px;color:var(--navy);background:var(--white);border:1.5px solid var(--pale);padding:8px 16px;border-radius:999px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.filter-btn:hover{border-color:var(--navy)}
.filter-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-header{padding:32px 24px 16px;max-width:680px;margin:0 auto}
.page-header h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--navy);margin-bottom:6px}
.page-header p{font-size:13px;color:var(--silver);line-height:1.6}
.active-filters{padding:0 24px 12px;max-width:680px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;min-height:28px}
.filter-chip{background:var(--navy);color:white;font-size:11px;font-weight:600;padding:4px 12px;border-radius:999px}
.month-filter{padding:0 24px 16px;max-width:680px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap}
.m-btn{padding:6px 14px;border-radius:999px;border:1.5px solid var(--pale);background:var(--white);color:var(--silver);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.m-btn:hover{border-color:var(--navy);color:var(--navy)}
.m-btn.active{background:var(--navy);color:white;border-color:var(--navy)}
.m-btn.current{border-color:var(--gold);color:var(--gold)}
.m-btn.active.current{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.content{max-width:680px;margin:0 auto;padding:0 24px 80px}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--white);border-radius:14px;margin-bottom:20px;border:1px solid rgba(21,34,72,.06);box-shadow:0 1px 6px rgba(21,34,72,.04)}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--silver)}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.month-block{margin-bottom:28px}
.month-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--silver);margin-bottom:10px;padding-left:4px}
.date-card{background:var(--white);border-radius:20px;overflow:hidden;box-shadow:0 2px 12px rgba(21,34,72,.06);border:1px solid rgba(21,34,72,.06);margin-bottom:10px}
.date-item{display:flex;align-items:stretch;border-bottom:1px solid var(--frost)}
.date-item:last-child{border-bottom:none}
.date-item.passed{opacity:.45}
.date-num{width:60px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 0;border-right:1px solid var(--frost)}
.date-num span{font-size:22px;font-weight:700;color:var(--navy);line-height:1;font-family:'Playfair Display',serif}
.date-num small{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--silver);margin-top:2px}
.date-entries{flex:1}
.date-entry{padding:13px 18px;border-bottom:1px solid var(--frost);display:flex;align-items:flex-start;gap:10px}
.date-entry:last-child{border-bottom:none}
.entry-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dot-red{background:#e57373}.dot-blue{background:#5b8dee}.dot-gold{background:var(--gold)}.dot-green{background:#5cb85c}.dot-purple{background:#9b59b6}
.entry-action{font-size:11px;color:var(--silver);margin-bottom:2px;font-weight:500}
.entry-title{font-size:13px;font-weight:600;color:var(--navy);line-height:1.4}
.today-badge{background:var(--gold);color:var(--ink);font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.5px;margin-left:6px;vertical-align:middle}
.empty{text-align:center;padding:48px 20px;color:var(--silver);font-size:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--white);border-radius:24px 24px 0 0;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;transform:translateY(40px);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--pale);position:sticky;top:0;background:var(--white);z-index:1;border-radius:24px 24px 0 0}
.modal-header h2{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--navy)}
.modal-close{width:34px;height:34px;border-radius:50%;background:var(--frost);border:none;font-size:16px;cursor:pointer;color:var(--silver);transition:all .2s}
.modal-close:hover{background:var(--pale);color:var(--navy)}
.modal-body{padding:20px 24px}
.modal-section{margin-bottom:24px}
.modal-section h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:12px}
.modal-options{background:var(--white);border:1px solid var(--pale);border-radius:16px;overflow:hidden}
.modal-option{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--frost);cursor:pointer;transition:background .15s}
.modal-option:last-child{border-bottom:none}
.modal-option:hover{background:var(--frost)}
.modal-option label{font-size:14px;font-weight:500;color:var(--navy);cursor:pointer;flex:1}
.modal-option input[type=radio]{width:20px;height:20px;accent-color:var(--navy);cursor:pointer;flex-shrink:0}
.modal-save{width:calc(100% - 48px);margin:0 24px 28px;background:var(--navy);color:white;border:none;padding:15px;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.modal-save:hover{background:#1a3a7c}

function matchFF(item) {
  if (item.ff === 'all') return true;
  if (item.ff === 'ab_hb') return settings.ff === 'ab' || settings.ff === 'hb';
  return item.ff === settings.ff;
}
function matchMoms(item) {
  if (item.moms === 'all') return true;
  return item.moms === settings.moms;
}

function isPassed(m,d){ return m<CM||(m===CM&&d<CD); }
function isToday(m,d){ return m===CM&&d===CD; }

function renderCalendar(filter) {
  const byMonth = {};
  DATES.forEach(item => {
    if (!matchFF(item)||!matchMoms(item)) return;
    if (filter!=='alla'&&MONTHS[item.m]!==filter) return;
    if (!byMonth[item.m]) byMonth[item.m]={};
    if (!byMonth[item.m][item.d]) byMonth[item.m][item.d]=[];
    const key=item.action+item.title;
    if (!byMonth[item.m][item.d].find(x=>x.action+x.title===key))
      byMonth[item.m][item.d].push(item);
  });

  const months=Object.keys(byMonth).sort((a,b)=>+a-+b);
  const container=document.getElementById('calendarContent');
  if (!months.length){container.innerHTML='<div class="empty">Inga datum för vald period och inställning.</div>';return;}

  let html='';
  months.forEach(m=>{
    html+=`<div class="month-block"><div class="month-label">${MNAMES[m]} 2026</div><div class="date-card">`;
    Object.keys(byMonth[m]).sort((a,b)=>+a-+b).forEach(d=>{
      const passed=isPassed(+m,+d), today=isToday(+m,+d);
      html+=`<div class="date-item${passed?' passed':''}"><div class="date-num"><span>${d}</span><small>${MONTHS[m]}</small></div><div class="date-entries">`;
      byMonth[m][d].forEach(item=>{
        html+=`<div class="date-entry"><div class="entry-dot dot-${item.type}"></div><div><div class="entry-action">${item.action}</div><div class="entry-title">${item.title}${today?'<span class="today-badge">IDAG</span>':''}</div></div></div>`;
      });
      html+=`</div></div>`;
    });
    html+=`</div></div>`;
  });
  container.innerHTML=html;
}

function renderChips(){
  const labels={ef:'Enskild firma',ab:'Aktiebolag',hb:'Handelsbolag',ar:'Moms: Årsvis',kvartal:'Moms: Kvartal',manad:'Moms: Månadsvis'};
  document.getElementById('activeFilters').innerHTML=
    [settings.ff,settings.moms].map(k=>`<div class="filter-chip">${labels[k]}</div>`).join('');
}

function filterMonth(m){
  currentFilter=m;
  document.querySelectorAll('.m-btn').forEach(btn=>{
    const t=btn.textContent.toLowerCase();
    btn.classList.remove('active');
    if((m==='alla'&&t==='alla')||t===m) btn.classList.add('active');
  });
  renderCalendar(m);
}

function openModal(){
  document.querySelector(`input[name=ff][value="${settings.ff}"]`).checked=true;
  document.querySelector(`input[name=moms][value="${settings.moms}"]`).checked=true;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow='';
}
function saveSettings(){
  settings.ff=document.querySelector('input[name=ff]:checked').value;
  settings.moms=document.querySelector('input[name=moms]:checked').value;
  localStorage.setItem('vd_ff',settings.ff);
  localStorage.setItem('vd_moms',settings.moms);
  closeModal();
  renderChips();
  renderCalendar(currentFilter);
}

document.querySelectorAll('.m-btn').forEach(btn=>{
  if(btn.textContent.toLowerCase()===MONTHS[CM]) btn.classList.add('current');
});

renderChips();
filterMonth(MONTHS[CM]);
</script>
